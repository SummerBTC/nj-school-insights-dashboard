<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#iconGrad)"/>

  <!-- School/Book Icon -->
  <g transform="translate(256, 256)">
    <!-- Book base -->
    <rect x="-120" y="-80" width="240" height="160" rx="10" fill="#ffffff" opacity="0.9"/>

    <!-- Book spine -->
    <rect x="-5" y="-80" width="10" height="160" fill="#E9D5FF"/>

    <!-- Lines on left page -->
    <line x1="-90" y1="-40" x2="-30" y2="-40" stroke="#7C3AED" stroke-width="4" opacity="0.6"/>
    <line x1="-90" y1="-10" x2="-30" y2="-10" stroke="#7C3AED" stroke-width="4" opacity="0.6"/>
    <line x1="-90" y1="20" x2="-30" y2="20" stroke="#7C3AED" stroke-width="4" opacity="0.6"/>

    <!-- Chart bars on right page -->
    <rect x="30" y="-20" width="20" height="50" fill="#7C3AED" opacity="0.7"/>
    <rect x="60" y="-40" width="20" height="70" fill="#7C3AED" opacity="0.7"/>
    <rect x="90" y="-10" width="20" height="40" fill="#7C3AED" opacity="0.7"/>
  </g>

  <!-- "S" letter for SchoolBerry -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="140" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.3">
    S
  </text>
</svg>
