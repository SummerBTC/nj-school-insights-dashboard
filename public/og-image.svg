<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B21B6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#grad1)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="#ffffff" opacity="0.1"/>
  <circle cx="1100" cy="530" r="80" fill="#ffffff" opacity="0.1"/>
  <circle cx="950" cy="150" r="40" fill="#ffffff" opacity="0.15"/>

  <!-- Title -->
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="middle">
    NJ School Insights
  </text>

  <!-- Subtitle -->
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="42" fill="#E9D5FF" text-anchor="middle">
    New Jersey School Rankings &amp; Data
  </text>

  <!-- Domain -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="36" fill="#ffffff" text-anchor="middle" opacity="0.9">
    schooberry.io
  </text>

  <!-- Icon/Badge -->
  <rect x="520" y="480" width="160" height="60" rx="30" fill="#ffffff" opacity="0.2"/>
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">
    📊 FREE
  </text>
</svg>
